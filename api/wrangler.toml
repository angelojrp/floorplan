# Config do Worker de API (separada da config de Pages na raiz, que só publica
# o site estático e não aceita bindings de Worker).
#
# Deploy:  npm run deploy:worker
# Migrations: npm run db:migrate:local  /  npm run db:migrate
name = "floorplan-api"
main = "worker.ts"
compatibility_date = "2026-06-16"
compatibility_flags = ["nodejs_compat"]

# Banco dos projetos/usuários. `database_id` é preenchido por quem faz o deploy
# (`wrangler d1 create floorplan` imprime o id); em dev local o Miniflare ignora.
[[d1_databases]]
binding = "DB"
database_name = "floorplan"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../migrations"

# Thumbnails dos projetos e, no futuro, imagens de render.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "floorplan-assets"
